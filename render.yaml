services:
  - type: web
    name: orbit-bots
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ORBIT_USE_OLLAMA
        value: "0"
      - key: ORBIT_USE_LOCAL_VIDEO
        value: "0"
      - key: ORBIT_PANEL_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://orbit-bots.onrender.com/auth/google/callback"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
