services:
  - type: web
    name: orbit-bots
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ORBIT_USE_OLLAMA
        value: "0"
      - key: ORBIT_USE_LOCAL_VIDEO
        value: "0"
      - key: ORBIT_PANEL_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
